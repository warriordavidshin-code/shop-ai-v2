services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop_ai
      POSTGRES_USER: shop_ai
      POSTGRES_PASSWORD: "shop_ai123!"
    ports:
      - "5432:5432"
    volumes:
      - shop_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_ai -d shop_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./shop-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/shop_ai
      DB_USERNAME: shop_ai
      DB_PASSWORD: shop_ai123!
      JWT_SECRET: replace-with-a-long-random-secret-at-least-32-chars
      COOKIE_SECURE: "false"
      AI_PROVIDER: rule
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./shop-frontend
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_STORE_NAME: BoutiqueCamel
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  shop_ai_pgdata:
