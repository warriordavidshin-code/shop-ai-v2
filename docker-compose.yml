services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - shop_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"${DB_USER}\" -d \"${DB_NAME}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - shop_ai_net

  backend:
    image: shop-ai-v2-backend:${BACKEND_IMAGE_TAG:-local}
    build:
      context: ./shop-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Spring Boot reads these via application.yml (${DB_URL}/${DB_USERNAME}/${DB_PASSWORD})
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?DB_NAME is required}
      DB_USERNAME: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      # Also set Spring Boot native datasource env for consistency (same values)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_SECONDS: ${JWT_ACCESS_TOKEN_SECONDS:-1800}
      JWT_REFRESH_TOKEN_SECONDS: ${JWT_REFRESH_TOKEN_SECONDS:-1209600}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AI_PROVIDER: ${AI_PROVIDER:-rule}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
      TZ: Asia/Seoul
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_HOST_PORT:-8080}:8080"
    volumes:
      - shop_ai_uploads:/app/uploads
      - shop_ai_backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 30s
    networks:
      - shop_ai_net

  frontend:
    image: shop-ai-v2-frontend:${FRONTEND_IMAGE_TAG:-local}
    build:
      context: ./shop-frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
        NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-BoutiqueCamel}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      NEXT_PUBLIC_STORE_NAME: ${NEXT_PUBLIC_STORE_NAME:-BoutiqueCamel}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: Asia/Seoul
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 20s
    networks:
      - shop_ai_net

networks:
  shop_ai_net:
    driver: bridge

volumes:
  shop_ai_pgdata:
  shop_ai_uploads:
  shop_ai_backend_logs:
