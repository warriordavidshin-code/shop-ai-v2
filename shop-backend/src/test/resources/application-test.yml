spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-algorithms
  cookie:
    secure: false
  ai:
    provider: rule
    openai:
      api-key:
      model:
    analysis:
      api-key:
      mock-enabled: false
      max-retries: 0
  upload:
    private-dir: ${java.io.tmpdir}/shop-ai-it-private

shipping:
  provider: MANUAL
  api-key:
  tracking:
    scheduler-enabled: false
