spring:
  main:
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-hs256-algorithms
  cookie:
    secure: false
  ai:
    provider: rule
    openai:
      api-key:
      model:
    analysis:
      api-key:
      mock-enabled: false
      max-retries: 0
    cost:
      mode: FREE_FIRST
      local-ocr-enabled: false
      openai-enabled: false
      paid-fallback-enabled: false
      daily-request-limit: 20
      monthly-budget-usd: 1.0
      gemini:
        api-key:
        max-retries: 0
      ocr:
        url: http://127.0.0.1:9
        timeout-seconds: 5
  upload:
    private-dir: ${java.io.tmpdir}/shop-ai-it-private

shipping:
  provider: MANUAL
  api-key:
  tracking:
    scheduler-enabled: false
