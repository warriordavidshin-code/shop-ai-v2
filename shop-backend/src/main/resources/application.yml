# Unified DB credential source for docker-compose.yml:
#   DB_NAME / DB_USER / DB_PASSWORD
#
# Local non-Docker runs (mvn spring-boot:run) still use DB_URL defaults below
# pointing at localhost.

spring:
  application:
    name: shop-backend
  autoconfigure:
    exclude:
      # Custom MailConfig creates JavaMailSender only when app.mail.enabled=true.
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop_ai}
    username: ${DB_USERNAME:shop_ai}
    password: ${DB_PASSWORD:shop_ai123!}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:60MB}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # Empty/misconfigured SMTP must not mark the whole app DOWN (Docker healthcheck).
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

app:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-chars}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:1800}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:1209600}
  cookie:
    secure: ${COOKIE_SECURE:false}
  oauth:
    frontend-url: ${FRONTEND_URL:https://btc-camel.com}
    # Prefer Next.js BFF so Set-Cookie attaches to the shop origin.
    public-callback-base: ${OAUTH_PUBLIC_CALLBACK_BASE:https://btc-camel.com/api/shop}
    kakao:
      enabled: ${KAKAO_ENABLED:false}
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      enabled: ${NAVER_ENABLED:false}
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@btc-camel.com}
  ai:
    provider: ${AI_PROVIDER:rule}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
    # Receipt / product image analysis (OpenAI Responses API). The key is read from the
    # server environment only and is never returned to the browser.
    analysis:
      receipt-enabled: ${AI_RECEIPT_ENABLED:true}
      product-enabled: ${AI_PRODUCT_ENABLED:true}
      # Mock mode returns clearly labelled sample results without calling OpenAI.
      mock-enabled: ${AI_MOCK_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
      default-model: gpt-4.1-mini
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      connect-timeout-seconds: ${AI_CONNECT_TIMEOUT_SECONDS:10}
      timeout-seconds: ${AI_TIMEOUT_SECONDS:90}
      max-retries: ${AI_MAX_RETRIES:2}
      retry-backoff-ms: ${AI_RETRY_BACKOFF_MS:1500}
      max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:4000}
      input-price-per-million: ${AI_INPUT_PRICE_PER_MILLION:0.40}
      output-price-per-million: ${AI_OUTPUT_PRICE_PER_MILLION:1.60}
      cache-days: ${AI_CACHE_DAYS:30}
      receipt-max-files: ${AI_RECEIPT_MAX_FILES:10}
      product-max-images: ${AI_PRODUCT_MAX_IMAGES:8}
      max-file-bytes: ${AI_MAX_FILE_BYTES:10485760}
    # Free-first routing: local OCR + Java rules -> Gemini (free tier) -> OpenAI (only when explicitly
    # enabled/approved) -> manual input. Paid APIs are never called automatically by default.
    cost:
      mode: ${AI_MODE:FREE_FIRST}
      local-ocr-enabled: ${AI_LOCAL_OCR_ENABLED:true}
      openai-enabled: ${OPENAI_ENABLED:false}
      daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:20}
      monthly-budget-usd: ${AI_MONTHLY_BUDGET_USD:1.0}
      cache-enabled: ${AI_CACHE_ENABLED:true}
      paid-fallback-enabled: ${AI_PAID_FALLBACK_ENABLED:false}
      gemini:
        api-key: ${GEMINI_API_KEY:}
        enabled: ${GEMINI_ENABLED:true}
        model: ${GEMINI_MODEL:gemini-2.5-flash}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
        free-tier: ${GEMINI_FREE_TIER:true}
        input-price-per-million: ${GEMINI_INPUT_PRICE_PER_MILLION:0.30}
        output-price-per-million: ${GEMINI_OUTPUT_PRICE_PER_MILLION:2.50}
        timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:90}
      ocr:
        url: ${AI_LOCAL_OCR_URL:http://localhost:8866}
        timeout-seconds: ${AI_LOCAL_OCR_TIMEOUT_SECONDS:120}
        min-confidence: ${AI_LOCAL_OCR_MIN_CONFIDENCE:0.75}
  timezone: Asia/Seoul
  upload:
    dir: ${UPLOAD_DIR:../uploads}
    # Purchase evidence (receipts, statements, transfer records). Never served publicly.
    private-dir: ${PRIVATE_UPLOAD_DIR:../private-uploads}

# Courier tracking. API key / client id come from env only (never commit them).
# Without SHIPPING_API_KEY the provider falls back to MANUAL (admin-entered status only).
shipping:
  provider: ${SHIPPING_PROVIDER:SWEETTRACKER}
  api-key: ${SHIPPING_API_KEY:}
  client-id: ${SHIPPING_CLIENT_ID:}
  sweettracker:
    base-url: ${SHIPPING_SWEETTRACKER_BASE_URL:https://info.sweettracker.co.kr}
  goodsflow:
    base-url: ${SHIPPING_GOODSFLOW_BASE_URL:}
  tracking:
    cache-minutes: ${SHIPPING_TRACKING_CACHE_MINUTES:25}
    force-refresh-min-seconds: ${SHIPPING_TRACKING_FORCE_REFRESH_MIN_SECONDS:60}
    scheduler-enabled: ${SHIPPING_TRACKING_SCHEDULER_ENABLED:true}
    cron: "${SHIPPING_TRACKING_CRON:0 */30 * * * *}"
    batch-size: ${SHIPPING_TRACKING_BATCH_SIZE:200}
    connect-timeout-ms: ${SHIPPING_TRACKING_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${SHIPPING_TRACKING_READ_TIMEOUT_MS:5000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  config: classpath:log4j2-spring.xml
