# Unified DB credential source for docker-compose.yml:
#   DB_NAME / DB_USER / DB_PASSWORD
#
# Local non-Docker runs (mvn spring-boot:run) still use DB_URL defaults below
# pointing at localhost.

spring:
  application:
    name: shop-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop_ai}
    username: ${DB_USERNAME:shop_ai}
    password: ${DB_PASSWORD:shop_ai123!}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-chars}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:1800}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:1209600}
  cookie:
    secure: ${COOKIE_SECURE:false}
  oauth:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    # Prefer Next.js BFF so Set-Cookie attaches to the shop origin.
    public-callback-base: ${OAUTH_PUBLIC_CALLBACK_BASE:http://localhost:3000/api/shop}
    kakao:
      enabled: ${KAKAO_ENABLED:false}
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      enabled: ${NAVER_ENABLED:false}
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
  ai:
    provider: ${AI_PROVIDER:rule}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
  timezone: Asia/Seoul
  upload:
    dir: ${UPLOAD_DIR:../uploads}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  config: classpath:log4j2-spring.xml
