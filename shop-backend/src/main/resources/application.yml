spring:
  application:
    name: shop-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop_ai}
    username: ${DB_USERNAME:shop_ai}
    password: ${DB_PASSWORD:shop_ai123!}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-long-random-secret-at-least-32-chars}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:1800}
    refresh-token-seconds: ${JWT_REFRESH_TOKEN_SECONDS:1209600}
  cookie:
    secure: ${COOKIE_SECURE:false}
  ai:
    provider: ${AI_PROVIDER:rule}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
  timezone: Asia/Seoul
  upload:
    dir: ${UPLOAD_DIR:../uploads}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Log4j2 config: classpath:log4j2-spring.xml
# Files: shop-ai-v2/log/shop-backend.log (daily: shop-backend-yyyy-MM-dd.log)
# Override directory with env LOG_DIR
logging:
  config: classpath:log4j2-spring.xml
